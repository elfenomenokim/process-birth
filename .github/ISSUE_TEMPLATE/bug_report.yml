name: Bug report
description: A start time parsed to the wrong second, or a valid line was rejected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: For a security problem, do not use this form. Use the Security tab advisory instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show process-birth`, or the commit you ran.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and ps
      placeholder: macOS 26 arm64, BSD ps; or Ubuntu 24.04, procps-ng 4.0.4
    validations:
      required: true
  - type: textarea
    id: line
    attributes:
      label: The ps line
      description: The exact output, captured with `LC_ALL=C TZ=UTC`.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual
      description: The second you expected, the value you got, and your timezone.
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback
      render: shell
    validations:
      required: false
